server {
    listen 80;
    server_name _;          # รับทุก IP / hostname — เปลี่ยนเป็น domain ถ้ามี

    # อัพโหลด / request body สูงสุด (สำหรับ sync eDevice)
    client_max_body_size 20M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Static files — ให้ Nginx serve โดยตรง (เร็วกว่า Flask)
    location /static/ {
        alias /opt/amarin-employee/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ส่งทุก request ไปยัง Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5100;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
